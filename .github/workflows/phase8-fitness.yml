name: Phase8 Fitness Gates

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  fitness:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore DumpDetective.slnx

      - name: Architecture and Fitness Tests
        run: >
          dotnet test tests/DumpDetective.Tests/DumpDetective.Tests.csproj
          --configuration Release
          --filter "FullyQualifiedName~DependencyDirectionTests|FullyQualifiedName~AnalyzerFeatureModuleSpikeTests|FullyQualifiedName~FitnessEnforcementTests|FullyQualifiedName~ProgramEntryPointTests|FullyQualifiedName~ReportingVisualsTests|FullyQualifiedName~HtmlRendererCssTests|FullyQualifiedName~P0SmokeTests"
          -v minimal

      - name: Benchmark Project Build Guardrail
        run: dotnet build src/BenchmarkSuite1/BenchmarkSuite1.csproj --configuration Release -v minimal

      - name: Phase0 Baseline Harness
        shell: pwsh
        run: ./tools/Phase0/Invoke-Phase0Baseline.ps1
