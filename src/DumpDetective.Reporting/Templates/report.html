<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DumpDetective Analysis Report</title>
  <style>{{CSS}}</style>
</head>
<body>
  <div class="skip-links" aria-label="Skip links">
    <a class="skip-link" href="#main">Skip to main content</a>
    <a class="skip-link" href="#sec-exec">Skip to summary</a>
    <a class="skip-link" href="#report-domains">Skip to domains</a>
    <a class="skip-link" href="#sec-appendix">Skip to appendix</a>
  </div>
  <p id="report-sr-summary" class="sr-only" aria-live="polite"></p>
  <div role="status" aria-live="polite" aria-atomic="true" id="clipboard-status" class="sr-only"></div>

  <div class="container page-shell">
    <aside class="report-navbar expanded" id="report-navbar" aria-label="Report navigation">
      <div class="report-navbar__brand">
        <div class="report-navbar__title">DumpDetective Analysis Report</div>
      </div>
      <div class="report-navbar__palette">
        <input class="report-navbar__search" id="toc-search" type="search" autocomplete="off" placeholder="Jump to a section…" aria-label="Search sections" />
      </div>
      <nav class="toc report-navbar__toc" id="toc" aria-label="Report sections">
        <!-- TOC will be injected here by JS -->
      </nav>
    </aside>

    <main id="main" class="report-main" tabindex="-1">
      <div id="report-content">
        {{PRE_RENDERED_HEALTH_SCORECARD}}
        {{PRE_RENDERED_FINDINGS}}
        {{PRE_RENDERED_ANALYZER_SECTIONS}}
      </div>
    </main>

    <aside class="report-right-rail" id="report-right-rail" aria-label="Action queue and quick metrics">
      <div class="report-right-rail__content" id="report-right-rail-content"></div>
    </aside>
  </div>

  <script id="report-json" type="application/json" data-encoding="{{REPORT_JSON_ENCODING}}">{{REPORT_JSON}}</script>
  <footer class="report-print-footer" id="report-print-footer" aria-hidden="true"></footer>
  {{JS}}
</body>
</html>
