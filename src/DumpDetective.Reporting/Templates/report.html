<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DumpDetective Analysis Report</title>
  <style>{{CSS}}</style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <div role="status" aria-live="polite" aria-atomic="true" id="clipboard-status" class="sr-only"></div>

  <div class="container page-shell">
    <aside class="report-navbar expanded" id="report-navbar" aria-label="Report navigation">
      <div class="report-navbar__brand">
        <div class="report-navbar__title">DumpDetective Analysis Report</div>
        <div class="report-navbar__meta">Generated by DumpDetective</div>
      </div>
      <div class="report-navbar__palette">
        <input class="report-navbar__search" id="toc-search" type="search" autocomplete="off" placeholder="Jump to a section…" aria-label="Search sections" />
      </div>
      <nav class="toc report-navbar__toc" id="toc" aria-label="Report sections">
        <!-- TOC will be injected here by JS -->
      </nav>
    </aside>

    <main id="main" tabindex="-1">
      <div id="report-content">
        {{PRE_RENDERED_HEALTH_SCORECARD}}
        {{PRE_RENDERED_FINDINGS}}
        {{PRE_RENDERED_ANALYZER_SECTIONS}}
      </div>
    </main>
  </div>

  <script id="report-json" type="application/json">{{REPORT_JSON}}</script>
  {{JS}}
</body>
</html>
